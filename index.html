<!DOCTYPE html>
<html lang="ru">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no">
<title>Флэшкарты для собесов</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Russo+One&family=Exo+2:ital,wght@0,400;0,600;0,700&display=swap" rel="stylesheet">
<style>
/* ============ THEMES ============ */
body{
  --bg:#04070e; --bg-grad1:#071224; --bg-grad2:#040a14;
  --panel:rgba(8,17,34,.88); --panel2:rgba(12,24,46,.92);
  --border:#1b3f66; --border-glow:rgba(70,190,255,.5);
  --accent:#46beff; --accent2:#7b8cff;
  --glow:rgba(70,190,255,.30); --glow-strong:rgba(70,190,255,.55);
  --text:#d9e9ff; --muted:#5f7ea6; --danger:#ff4d6e; --ok:#3ddc97;
}
body[data-theme="monarch"]{
  --bg:#080412; --bg-grad1:#150a2e; --bg-grad2:#0a0518;
  --panel:rgba(18,10,38,.88); --panel2:rgba(26,14,52,.92);
  --border:#412a7a; --border-glow:rgba(168,110,255,.5);
  --accent:#b077ff; --accent2:#ff6bd5;
  --glow:rgba(168,110,255,.30); --glow-strong:rgba(168,110,255,.55);
  --text:#ecdfff; --muted:#8a6fb8; --danger:#ff4d6e; --ok:#3ddc97;
}
body[data-theme="blood"]{
  --bg:#0d0406; --bg-grad1:#24070d; --bg-grad2:#140407;
  --panel:rgba(34,8,14,.88); --panel2:rgba(48,12,20,.92);
  --border:#6e1d2c; --border-glow:rgba(255,80,100,.5);
  --accent:#ff4d6e; --accent2:#ffa04d;
  --glow:rgba(255,80,100,.28); --glow-strong:rgba(255,80,100,.5);
  --text:#ffe3e8; --muted:#b06a78; --danger:#ff4d6e; --ok:#3ddc97;
}

/* ============ BASE ============ */
*{margin:0;padding:0;box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html,body{height:100%}
body{
  font-family:'Exo 2','Segoe UI',system-ui,sans-serif;
  background:var(--bg);
  background-image:radial-gradient(ellipse 80% 55% at 50% -10%, var(--bg-grad1), transparent),
                   radial-gradient(ellipse 70% 50% at 50% 110%, var(--bg-grad2), transparent);
  background-attachment:fixed;
  color:var(--text); min-height:100vh; overflow-x:hidden;
  transition:background .4s;
}
body::before{ /* scanlines */
  content:''; position:fixed; inset:0; pointer-events:none; z-index:999;
  background:repeating-linear-gradient(0deg, transparent 0 2px, rgba(255,255,255,.012) 2px 4px);
}
h1,h2,.sys-font{font-family:'Russo One','Exo 2',sans-serif;font-weight:400}

.screen{display:none;min-height:100vh;padding:20px;max-width:1100px;margin:0 auto}
.screen.active{display:block;animation:fadeUp .35s ease}
@keyframes fadeUp{from{opacity:0;transform:translateY(14px)}to{opacity:1;transform:none}}

/* ============ SYSTEM PANEL (SL window) ============ */
.sys-panel{
  position:relative; background:var(--panel);
  border:1px solid var(--border);
  box-shadow:0 0 22px var(--glow), inset 0 0 30px rgba(0,0,0,.35);
  backdrop-filter:blur(6px);
  clip-path:polygon(14px 0, 100% 0, 100% calc(100% - 14px), calc(100% - 14px) 100%, 0 100%, 0 14px);
}
.corner{position:absolute;width:14px;height:14px;pointer-events:none}
.corner.tl{top:0;left:0;border-top:2px solid var(--accent);border-left:2px solid var(--accent)}
.corner.tr{top:0;right:0;border-top:2px solid var(--accent);border-right:2px solid var(--accent)}
.corner.bl{bottom:0;left:0;border-bottom:2px solid var(--accent);border-left:2px solid var(--accent)}
.corner.br{bottom:0;right:0;border-bottom:2px solid var(--accent);border-right:2px solid var(--accent)}

.sys-tag{
  font-family:'Russo One',sans-serif;font-size:12px;letter-spacing:6px;color:var(--accent);
  text-transform:uppercase;text-align:center;opacity:.9;
  text-shadow:0 0 12px var(--glow-strong);
}

/* ============ HOME ============ */
#home{display:none;flex-direction:column;align-items:center;justify-content:center;gap:26px;text-align:center}
#home.active{display:flex}
#home h1{
  font-size:clamp(30px,7vw,54px);line-height:1.15;letter-spacing:2px;text-transform:uppercase;
  background:linear-gradient(180deg,var(--text) 30%,var(--accent));
  -webkit-background-clip:text;background-clip:text;color:transparent;
  filter:drop-shadow(0 0 18px var(--glow-strong));
}
.streak-panel{
  padding:12px 26px;font-size:15px;color:var(--text);
  display:flex;align-items:center;gap:10px;
}
.streak-panel b{font-family:'Russo One',sans-serif;font-size:22px;color:var(--accent);text-shadow:0 0 10px var(--glow-strong)}
.streak-panel .fire{font-size:22px;filter:drop-shadow(0 0 6px rgba(255,150,50,.8))}
.streak-dead{filter:grayscale(1);opacity:.55}

.menu-btn{
  width:min(430px,92vw);padding:22px 26px;cursor:pointer;text-align:left;
  color:var(--text);font-family:'Exo 2',sans-serif;
  display:flex;align-items:center;gap:18px;
  background:var(--panel);border:1px solid var(--border);
  clip-path:polygon(16px 0, 100% 0, 100% calc(100% - 16px), calc(100% - 16px) 100%, 0 100%, 0 16px);
  box-shadow:0 0 18px var(--glow), inset 0 0 24px rgba(0,0,0,.3);
  transition:all .25s; position:relative;
}
.menu-btn:hover, .menu-btn:active{
  border-color:var(--accent); box-shadow:0 0 34px var(--glow-strong), inset 0 0 24px rgba(0,0,0,.3);
  transform:translateY(-2px);
}
.menu-btn .mb-icon{font-size:34px;filter:drop-shadow(0 0 8px var(--glow-strong))}
.menu-btn .mb-title{font-family:'Russo One',sans-serif;font-size:19px;letter-spacing:1px;text-transform:uppercase}
.menu-btn .mb-sub{font-size:13px;color:var(--muted);margin-top:4px}

/* ============ THEME SWITCHER ============ */
#themeBtn{
  position:fixed;top:14px;right:14px;z-index:60;width:44px;height:44px;font-size:20px;cursor:pointer;
  background:var(--panel);border:1px solid var(--border);color:var(--text);
  clip-path:polygon(8px 0,100% 0,100% calc(100% - 8px),calc(100% - 8px) 100%,0 100%,0 8px);
  box-shadow:0 0 14px var(--glow);transition:all .2s;
}
#themeBtn:hover{border-color:var(--accent)}
#themePop{
  position:fixed;top:64px;right:14px;z-index:60;padding:12px;display:none;flex-direction:column;gap:8px;
  background:var(--panel2);border:1px solid var(--border);box-shadow:0 0 20px var(--glow);
}
#themePop.open{display:flex}
.theme-opt{
  display:flex;align-items:center;gap:10px;padding:8px 14px;cursor:pointer;border:1px solid transparent;
  background:transparent;color:var(--text);font-family:'Exo 2',sans-serif;font-size:13px;transition:all .2s;text-align:left;
}
.theme-opt:hover{border-color:var(--accent)}
.theme-opt .sw{width:18px;height:18px;border-radius:50%;box-shadow:0 0 8px currentColor}
.sw-shadow{background:#46beff;color:#46beff}
.sw-monarch{background:#b077ff;color:#b077ff}
.sw-blood{background:#ff4d6e;color:#ff4d6e}

/* ============ SUB-SCREEN HEADER ============ */
.sub-head{display:flex;align-items:center;gap:14px;margin-bottom:18px;flex-wrap:wrap}
.back-btn{
  padding:9px 18px;cursor:pointer;background:var(--panel);border:1px solid var(--border);color:var(--accent);
  font-family:'Russo One',sans-serif;font-size:13px;letter-spacing:1px;
  clip-path:polygon(10px 0,100% 0,100% calc(100% - 10px),calc(100% - 10px) 100%,0 100%,0 10px);
  box-shadow:0 0 12px var(--glow);transition:all .2s;
}
.back-btn:hover{border-color:var(--accent)}
.sub-head h2{font-size:clamp(19px,4.5vw,26px);letter-spacing:2px;text-transform:uppercase;color:var(--text);text-shadow:0 0 14px var(--glow-strong)}

/* ============ BASE SCREEN ============ */
#search{
  width:100%;padding:12px 16px;font-size:15px;color:var(--text);font-family:'Exo 2',sans-serif;
  background:var(--panel);border:1px solid var(--border);outline:none;margin-bottom:12px;
  clip-path:polygon(10px 0,100% 0,100% calc(100% - 10px),calc(100% - 10px) 100%,0 100%,0 10px);
}
#search:focus{border-color:var(--accent);box-shadow:0 0 16px var(--glow)}
#search::placeholder{color:var(--muted)}
.filters{display:flex;gap:8px;overflow-x:auto;padding-bottom:10px;margin-bottom:14px;scrollbar-width:thin}
.chip{
  padding:7px 15px;white-space:nowrap;cursor:pointer;font-size:13px;font-family:'Exo 2',sans-serif;
  background:var(--panel);border:1px solid var(--border);color:var(--muted);
  clip-path:polygon(8px 0,100% 0,100% calc(100% - 8px),calc(100% - 8px) 100%,0 100%,0 8px);
  transition:all .2s;flex-shrink:0;
}
.chip.active{color:var(--text);border-color:var(--accent);box-shadow:0 0 12px var(--glow);text-shadow:0 0 8px var(--glow-strong)}
.sec-title{
  font-family:'Russo One',sans-serif;font-size:16px;letter-spacing:1.5px;text-transform:uppercase;
  margin:22px 0 12px;color:var(--accent);text-shadow:0 0 10px var(--glow-strong);
  display:flex;align-items:center;gap:10px;
}
.sec-title .cnt{font-size:11px;color:var(--muted);border:1px solid var(--border);padding:2px 9px;text-shadow:none}
.grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(270px,1fr));gap:12px}
.card{perspective:1200px;height:170px;cursor:pointer;position:relative}
.card-inner{position:relative;width:100%;height:100%;transition:transform .5s;transform-style:preserve-3d}
.card.flipped .card-inner{transform:rotateY(180deg)}
.card-face{
  position:absolute;inset:0;backface-visibility:hidden;-webkit-backface-visibility:hidden;
  padding:16px;display:flex;flex-direction:column;overflow:hidden;
  background:var(--panel);border:1px solid var(--border);
  clip-path:polygon(12px 0,100% 0,100% calc(100% - 12px),calc(100% - 12px) 100%,0 100%,0 12px);
  box-shadow:0 0 14px var(--glow), inset 0 0 20px rgba(0,0,0,.3);
}
.card:hover .card-face{border-color:var(--accent)}
.card-back{transform:rotateY(180deg);background:var(--panel2)}
.card-q{font-size:14px;font-weight:600;line-height:1.4;overflow-y:auto}
.card-a{font-size:12.5px;line-height:1.45;color:var(--text);overflow-y:auto;white-space:pre-wrap}
.card-label{font-size:10px;letter-spacing:2px;text-transform:uppercase;color:var(--muted);margin-bottom:8px;font-family:'Russo One',sans-serif}
.card-back .card-label{color:var(--accent)}
.del-btn{
  position:absolute;top:6px;right:10px;z-index:5;width:24px;height:24px;font-size:13px;cursor:pointer;
  background:transparent;border:1px solid var(--border);color:var(--muted);opacity:0;transition:all .2s;
}
.card:hover .del-btn{opacity:1}
.del-btn:hover{color:var(--danger);border-color:var(--danger)}

/* add button + modal */
#addBtn{
  position:fixed;bottom:22px;right:22px;z-index:50;width:60px;height:60px;font-size:30px;cursor:pointer;
  background:var(--panel2);border:1px solid var(--accent);color:var(--accent);
  clip-path:polygon(14px 0,100% 0,100% calc(100% - 14px),calc(100% - 14px) 100%,0 100%,0 14px);
  box-shadow:0 0 22px var(--glow-strong);transition:all .2s;
}
#addBtn:hover{transform:scale(1.07)}
.modal-ov{position:fixed;inset:0;z-index:70;background:rgba(0,0,0,.75);display:none;align-items:center;justify-content:center;padding:16px;backdrop-filter:blur(4px)}
.modal-ov.open{display:flex}
.modal{width:min(480px,100%);padding:26px;position:relative;background:var(--panel2);border:1px solid var(--border);box-shadow:0 0 34px var(--glow-strong);
  clip-path:polygon(16px 0,100% 0,100% calc(100% - 16px),calc(100% - 16px) 100%,0 100%,0 16px)}
.modal h3{font-family:'Russo One',sans-serif;font-size:16px;letter-spacing:2px;text-transform:uppercase;color:var(--accent);margin-bottom:16px;text-shadow:0 0 10px var(--glow-strong)}
.modal label{display:block;font-size:12px;color:var(--muted);margin:12px 0 5px;letter-spacing:1px;text-transform:uppercase}
.modal select,.modal textarea{
  width:100%;padding:10px 12px;font-size:14px;color:var(--text);font-family:'Exo 2',sans-serif;
  background:var(--panel);border:1px solid var(--border);outline:none;resize:vertical;
}
.modal select:focus,.modal textarea:focus{border-color:var(--accent)}
.modal textarea{min-height:80px}
.modal-btns{display:flex;gap:10px;margin-top:20px}
.btn{
  flex:1;padding:12px;font-family:'Russo One',sans-serif;font-size:13px;letter-spacing:1px;cursor:pointer;text-transform:uppercase;
  background:var(--panel);border:1px solid var(--border);color:var(--muted);transition:all .2s;
  clip-path:polygon(10px 0,100% 0,100% calc(100% - 10px),calc(100% - 10px) 100%,0 100%,0 10px);
}
.btn.primary{color:var(--text);border-color:var(--accent);box-shadow:0 0 14px var(--glow)}
.btn:hover{border-color:var(--accent);color:var(--text)}

/* ============ TRAINER MENU ============ */
#trainer .menu-btn{width:min(430px,100%);margin:0 auto}
.trainer-list{display:flex;flex-direction:column;gap:16px;align-items:center;margin-top:30px}

/* ============ TRAINING OVERLAY ============ */
#tov{position:fixed;inset:0;z-index:80;background:var(--bg);display:none;flex-direction:column;padding:16px;
  background-image:radial-gradient(ellipse 80% 55% at 50% -10%, var(--bg-grad1), transparent)}
#tov.open{display:flex}
.t-top{display:flex;align-items:center;gap:12px;margin-bottom:14px;max-width:640px;width:100%;margin-left:auto;margin-right:auto}
#tclose{width:38px;height:38px;font-size:16px;cursor:pointer;background:var(--panel);border:1px solid var(--border);color:var(--muted);flex-shrink:0}
#tclose:hover{color:var(--danger);border-color:var(--danger)}
.t-prog{flex:1;height:8px;background:var(--panel);border:1px solid var(--border);overflow:hidden}
#tpf{height:100%;width:0;background:linear-gradient(90deg,var(--accent),var(--accent2));box-shadow:0 0 10px var(--glow-strong);transition:width .3s}
#tcnt{font-family:'Russo One',sans-serif;font-size:13px;color:var(--accent);flex-shrink:0;text-shadow:0 0 8px var(--glow-strong)}
.t-mid{flex:1;display:flex;align-items:center;justify-content:center;position:relative;overflow:hidden}
#tcard{
  width:min(560px,94vw);min-height:340px;max-height:72vh;padding:26px;cursor:pointer;position:relative;
  display:flex;flex-direction:column;user-select:none;touch-action:pan-y;
  background:var(--panel2);border:1px solid var(--border);
  clip-path:polygon(18px 0,100% 0,100% calc(100% - 18px),calc(100% - 18px) 100%,0 100%,0 18px);
  box-shadow:0 0 30px var(--glow), inset 0 0 40px rgba(0,0,0,.35);
}
#ttopic{font-size:11px;letter-spacing:2px;text-transform:uppercase;color:var(--accent);margin-bottom:14px;font-family:'Russo One',sans-serif;text-shadow:0 0 8px var(--glow-strong)}
#tq{font-size:18px;font-weight:700;line-height:1.45}
#tans{display:none;margin-top:16px;padding-top:16px;border-top:1px solid var(--border);overflow-y:auto}
#tans.visible{display:block}
#tatext{font-size:14px;line-height:1.55;white-space:pre-wrap;color:var(--text)}
#thint{margin-top:auto;padding-top:14px;text-align:center;font-size:12px;color:var(--muted);letter-spacing:1px}
.tind{position:absolute;top:18px;font-family:'Russo One',sans-serif;font-size:14px;letter-spacing:1px;padding:6px 14px;border:2px solid;opacity:0;transition:opacity .15s;pointer-events:none}
#tind-l{left:14px;color:var(--accent2);border-color:var(--accent2);transform:rotate(-8deg)}
#tind-r{right:14px;color:var(--ok);border-color:var(--ok);transform:rotate(8deg)}
.t-hints{display:flex;justify-content:space-between;max-width:640px;width:100%;margin:10px auto 0;font-size:11.5px;color:var(--muted);letter-spacing:.5px}
.t-actions{display:flex;gap:14px;max-width:640px;width:100%;margin:12px auto 6px}
.t-actions .btn{padding:15px;font-size:14px}
#tno{color:var(--accent2)}
#tno:not(:disabled){border-color:var(--accent2)}
#tyes{color:var(--ok)}
#tyes:not(:disabled){border-color:var(--ok);box-shadow:0 0 14px rgba(61,220,151,.25)}
.btn:disabled{opacity:.35;cursor:default}
/* finish */
#tfinish{display:none;flex-direction:column;align-items:center;justify-content:center;gap:18px;flex:1;text-align:center}
#tfinish.visible{display:flex}
#tfinish h2{font-size:26px;letter-spacing:3px;text-transform:uppercase;text-shadow:0 0 18px var(--glow-strong)}
#tfinish .lvlup{font-family:'Russo One',sans-serif;font-size:13px;letter-spacing:4px;color:var(--accent);animation:pulse 1.6s infinite}
@keyframes pulse{0%,100%{opacity:.6}50%{opacity:1;text-shadow:0 0 16px var(--glow-strong)}}
#tfinmsg{font-size:15px;color:var(--text)}
#tfinstreak{font-size:14px;color:var(--muted)}
#tfinstreak b{color:var(--accent);font-size:18px}
#tfinish .modal-btns{width:min(360px,90vw)}

@media(max-width:600px){
  .grid{grid-template-columns:1fr}
  #tq{font-size:16px}
  .screen{padding:14px}
}
</style>
</head>
<body>

<button id="themeBtn" title="Сменить тему">🎨</button>
<div id="themePop">
  <button class="theme-opt" data-theme=""><span class="sw sw-shadow"></span> Тень Системы</button>
  <button class="theme-opt" data-theme="monarch"><span class="sw sw-monarch"></span> Монарх Теней</button>
  <button class="theme-opt" data-theme="blood"><span class="sw sw-blood"></span> Кровавый Клинок</button>
</div>

<!-- ============ HOME ============ -->
<div id="home" class="screen active">
  <h1>Флэшкарты<br>для собесов</h1>
  <div class="streak-panel sys-panel" id="streakPanel">
    <span class="corner tl"></span><span class="corner tr"></span><span class="corner bl"></span><span class="corner br"></span>
    <span class="fire" id="streakFire">🔥</span>
    <span>Серия: <b id="streakCount">0</b> <span id="streakWord">дней</span></span>
  </div>
  <button class="menu-btn" id="goBase">
    <span class="mb-icon">📚</span>
    <span><span class="mb-title">База вопросов</span><div class="mb-sub" id="baseStats"></div></span>
  </button>
  <button class="menu-btn" id="goTrain">
    <span class="mb-icon">⚔️</span>
    <span><span class="mb-title">Тренироваться</span><div class="mb-sub">Случайные карточки из всей базы</div></span>
  </button>
</div>

<!-- ============ БАЗА ВОПРОСОВ ============ -->
<div id="base" class="screen">
  <div class="sub-head">
    <button class="back-btn" data-back>‹ Назад</button>
    <h2>База вопросов</h2>
  </div>
  <input id="search" type="text" placeholder="Поиск по вопросам и ответам...">
  <div class="filters" id="filters"></div>
  <div id="main"></div>
  <button id="addBtn" title="Добавить карточку">+</button>
</div>

<!-- modal add card -->
<div class="modal-ov" id="modalOv">
  <div class="modal">
    <h3>◈ Новая карточка</h3>
    <label>Тема</label>
    <select id="mTopic"></select>
    <label>Вопрос</label>
    <textarea id="mQ" placeholder="Введи вопрос..."></textarea>
    <label>Ответ</label>
    <textarea id="mA" placeholder="Введи ответ..."></textarea>
    <div class="modal-btns">
      <button class="btn" id="mCancel">Отмена</button>
      <button class="btn primary" id="mSave">Сохранить</button>
    </div>
  </div>
</div>

<!-- ============ ТРЕНАЖЁР ============ -->
<div id="trainer" class="screen">
  <div class="sub-head">
    <button class="back-btn" data-back>‹ Назад</button>
    <h2>Тренажёр</h2>
  </div>
  <div class="trainer-list">
    <button class="menu-btn" data-count="10">
      <span class="mb-icon">⚡</span>
      <span><span class="mb-title">Быстрая</span><div class="mb-sub">10 вопросов · разминка</div></span>
    </button>
    <button class="menu-btn" data-count="20">
      <span class="mb-icon">🎯</span>
      <span><span class="mb-title">Обычная</span><div class="mb-sub">20 вопросов · стандартный данж</div></span>
    </button>
    <button class="menu-btn" data-count="30">
      <span class="mb-icon">💀</span>
      <span><span class="mb-title">Серьёзная</span><div class="mb-sub">30 вопросов · красные врата</div></span>
    </button>
  </div>
</div>

<!-- ============ TRAINING OVERLAY ============ -->
<div id="tov">
  <div class="t-top">
    <button id="tclose">✕</button>
    <div class="t-prog"><div id="tpf"></div></div>
    <span id="tcnt">0 / 0</span>
  </div>
  <div class="t-mid">
    <div id="tcard">
      <div class="tind" id="tind-l">↺ ПОВТОРИТЬ</div>
      <div class="tind" id="tind-r">ДАЛЕЕ ✓</div>
      <div id="ttopic"></div>
      <div id="tq"></div>

{q:'Зачем использовать pytest.mark.parametrize?',a:'Избегать дублирования тестов с разными входными параметрами — компактно, расширяемо, читаемо.'},

{q:'Как валидируешь поля с вложенной структурой в JSON?',a:'Pydantic-модели с вложенными схемами — типизируют вложенные поля, проверяют наличие, тип, обязательность.'},
{q:'Какие метрики смотришь по автотестам?',a:'Flaky rate, pass/fail %, время прогона, покрытие регресса. Визуализация через Allure.'},
{q:'Что добавляешь в Allure-отчет?',a:'Шаги, description, severity, ссылки на задачи, скриншоты, attach логов, кастомные названия.'},
{q:'Что такое контрактное тестирование?',a:'Проверка соответствия данных от API заранее определённой схеме (JSON Schema, Pydantic). Помогает на границе между сервисами.'},
{q:'Что такое test pyramid и зачем она нужна?',a:'Подход: больше юнитов, меньше UI. Поддерживает стабильность, скорость, изоляцию.'},
{q:'Что такое тестовая документация и ведёшь ли её?',a:'Описание покрытия: структура, что проверяется, как запускать. Обычно README + Allure.'},
]},

{id:'db',name:'Базы данных',emoji:'🗄️',cards:[
{q:'Что такое база данных?',a:'Организованное хранилище данных, структурированных для эффективного управления, изменения и доступа.'},
{q:'Что такое СУБД?',a:'Система управления БД — ПО для создания, чтения, обновления, удаления данных (CRUD), управления транзакциями и безопасностью.'},
{q:'Что такое первичный ключ (Primary Key)?',a:'Уникальный идентификатор строки. Уникальный, NOT NULL, один на таблицу (может быть составным).'},
{q:'Что такое внешний ключ (Foreign Key)?',a:'Поле, ссылающееся на первичный ключ другой таблицы. Обеспечивает ссылочную целостность и связь таблиц.'},
{q:'Что такое нормализация?',a:'Структурирование таблиц для уменьшения дублирования данных, повышения целостности, избегания аномалий при обновлении.'},
{q:'Что такое денормализация?',a:'Осознанное дублирование данных для ускорения чтения. Используется в аналитике и системах с преобладанием чтения.'},
{q:'Что такое ACID?',a:'A — Atomicity (атомарность): всё или ничего.\nC — Consistency (согласованность): БД в корректном состоянии.\nI — Isolation (изолированность): параллельные транзакции не мешают.\nD — Durability (надёжность): зафиксированные данные сохраняются при сбоях.'},
{q:'Какие JOIN знаете?',a:'INNER, LEFT, RIGHT, FULL, CROSS, SELF JOIN.'},
{q:'Чем отличаются INNER, LEFT, RIGHT, FULL JOIN?',a:'INNER — только пересечение.\nLEFT — все из левой + совпадения справа.\nRIGHT — наоборот.\nFULL — всё из обеих + NULL там, где нет совпадений.'},
{q:'Разница между WHERE и HAVING?',a:'WHERE фильтрует строки до группировки.\nHAVING фильтрует после группировки, работает с агрегатами.'},
{q:'Что такое транзакция?',a:'Набор операций, выполняемых как единое целое (ACID).'},
{q:'Уровни изоляции транзакций',a:'Read Uncommitted — все проблемы, максимальная скорость.\nRead Committed — нет грязного чтения (default у многих СУБД).\nRepeatable Read — нет неповторяющегося чтения (default MySQL).\nSerializable — запрещает все проблемы, минимальная скорость.'},
{q:'Что такое индексы?',a:'Структуры данных (обычно B-Tree), ускоряющие поиск, но замедляющие вставку и обновление.'},
{q:'Какие бывают индексы?',a:'B-tree, Hash, Bitmap, Full-text, GiST/GIN (PostgreSQL), уникальные/неуникальные, составные.'},
{q:'Как посмотреть explain-план?',a:'EXPLAIN SELECT ...\nEXPLAIN ANALYZE SELECT ...'},
{q:'Разница между DELETE, TRUNCATE и DROP?',a:'DELETE — удаляет строки, можно откатить.\nTRUNCATE — быстрая очистка таблицы.\nDROP — удаляет таблицу целиком.'},
{q:'Как посчитать количество записей?',a:'SELECT COUNT(*) FROM table;'},
{q:'Что такое агрегатные функции?',a:'SUM, AVG, MIN, MAX, COUNT — работа с группами данных.'},
{q:'Что такое оконные функции?',a:'Вычисляют агрегаты по «окну», не группируя строки.\nПример: SELECT salary, SUM(salary) OVER() FROM employees;'},
{q:'Что такое SQL-инъекция? Как избежать?',a:'Вставка вредоносного SQL. Защита: prepared statements, параметризация запросов, валидация ввода.'},
{q:'Что такое deadlock? Как избежать?',a:'Две транзакции ждут друг друга, обе блокируются.\nИзбежать: одинаковый порядок блокировок, короткие транзакции, меньшая гранулярность.'},
{q:'Какие типы данных в БД знаете?',a:'INT, BIGINT, DECIMAL, VARCHAR, TEXT, DATE, TIMESTAMP, BOOLEAN, JSON/JSONB, BLOB, ENUM.'},
{q:'Отличие реляционных и нереляционных БД?',a:'Реляционные — таблицы, строгая схема, SQL (PostgreSQL).\nНереляционные — документы/графы/ключ-значение, гибкая схема (MongoDB).'},
{q:'Для чего нужен GROUP BY?',a:'Группирует строки по полю и позволяет применять агрегатные функции.'},
{q:'Зачем используется ORDER BY?',a:'Сортировка результата запроса.'},
{q:'Для чего применяют DISTINCT?',a:'Убирает дубликаты строк.'},
{q:'Отличие LIMIT и OFFSET?',a:'LIMIT — количество строк. OFFSET — пропустить N строк.'},
{q:'Отличие UNION от UNION ALL?',a:'UNION — убирает дубликаты. UNION ALL — оставляет дубликаты, работает быстрее.'},
{q:'Отличие UNION от JOIN?',a:'JOIN объединяет строки по полям (горизонтально).\nUNION объединяет результаты запросов вертикально.'},
{q:'Что такое NULL в БД?',a:'Отсутствие значения. НЕ равно 0 и НЕ равно пустой строке.'},
{q:'Что такое триггер в БД?',a:'Код, автоматически выполняемый при INSERT, UPDATE или DELETE.'},
{q:'Что такое хранимая процедура?',a:'Функция, хранящаяся в БД. Вызывается с параметрами, содержит логику (циклы, условия).'},
{q:'Что такое грязное и фантомное чтение?',a:'Грязное: читаем незакоммиченные данные другой транзакции (если та сделает ROLLBACK — данные окажутся несуществующими).\nФантомное: повторный запрос видит новые строки, которых раньше не было.'},
]},
{id:'docker',name:'Docker',emoji:'🐳',cards:[
{q:'Что такое Docker и зачем нужен?',a:'Платформа контейнеризации: упаковывает приложение со всеми зависимостями. Даёт одинаковую среду Dev/QA/Prod, быстрый деплой, изоляцию, переносимость.'},
{q:'Что такое образ и контейнер?',a:'Image (образ) — шаблон из слоёв + конфигурации.\nContainer (контейнер) — запущенный экземпляр образа.\nImage = чертёж, Container = дом по чертежу.'},
{q:'Что такое Dockerfile?',a:'Текстовый файл с инструкциями сборки образа:\nFROM, COPY, RUN, EXPOSE, CMD/ENTRYPOINT.\nDockerfile → docker build → image.'},
{q:'Что такое многоступенчатая сборка?',a:'Multi-stage build — несколько блоков FROM в одном Dockerfile. Собираем в одном контейнере, копируем артефакты в чистый образ → меньший размер.'},
{q:'Что такое docker volume?',a:'Внешний по отношению к контейнеру каталог. Сохраняет данные при удалении контейнера, шарит данные между контейнерами.'},
{q:'Чем отличается CMD от ENTRYPOINT?',a:'CMD — дефолтная команда, можно переопределить при docker run.\nENTRYPOINT — точка входа, почти невозможно переопределить.'},
{q:'Что такое слой в image?',a:'Каждая команда Dockerfile создаёт слой. Слои кешируются, переиспользуются, immutable.'},
{q:'Можно ли изменить образ после сборки?',a:'Нет, image immutable. Только собрать новый.'},
{q:'Что такое docker network?',a:'Виртуальная сеть для взаимодействия контейнеров между собой.'},
{q:'Какие типы сетей в Docker знаете?',a:'bridge (дефолт), host (сеть хоста), none (без сети), overlay (Swarm), macvlan (контейнер как отдельный хост).'},
{q:'Как Docker изолирует контейнеры?',a:'namespaces (PID, NET, MNT, UTS, USER), cgroups (лимиты CPU/RAM), chroot (файловая система), overlayfs (слои).'},
{q:'Как смотреть ресурсы контейнеров?',a:'docker stats\ndocker stats <container_id>'},
{q:'Что такое docker inspect?',a:'Выводит полный JSON о контейнере: ENV, Cmd, Entrypoint, NetworkSettings, Mounts, State, LogPath, HostConfig.Resources.'},
{q:'Как дебажить контейнер, который сразу падает?',a:'docker logs <id>\ndocker run -it --entrypoint bash <image>\nПроверить зависимости.'},
{q:'Как посмотреть env переменные контейнера?',a:'docker exec <id> env'},
{q:'Как посмотреть все запущенные контейнеры?',a:'docker ps'},
{q:'Как посмотреть все контейнеры (включая остановленные)?',a:'docker ps -a'},
{q:'Как запустить контейнер в фоне с пробросом порта?',a:'docker run -d -p 8080:80 nginx'},
{q:'Как зайти внутрь контейнера?',a:'docker exec -it <container_id> bash'},
{q:'Как посмотреть логи контейнера?',a:'docker logs <container_id>'},
{q:'Как удалить контейнер / образ?',a:'docker rm <container_id>\ndocker rmi <image_id>'},
{q:'Как удалить все остановленные контейнеры?',a:'docker container prune'},
{q:'Как посмотреть историю слоёв образа?',a:'docker history <image>'},
{q:'Как поднять приложение через docker-compose?',a:'docker-compose up -d'},
{q:'Как остановить все из docker-compose?',a:'docker-compose down'},
{q:'Как остановить, запустить, перезапустить контейнер?',a:'docker stop <id>\ndocker start <id>\ndocker restart <id>'},
{q:'Как смотреть логи в реальном времени?',a:'docker logs -f <id>'},
{q:'Как подключиться интерактивно?',a:'docker exec -it <id> bash'},
{q:'Как посмотреть подробности о сети?',a:'docker network inspect <network_name>'},
{q:'Как посмотреть тома?',a:'docker volume ls\ndocker volume inspect <volume_name>'},
{q:'Как примонтировать том в контейнер?',a:'docker run -d -v my_volume:/data nginx'},
]},
{id:'k8s',name:'Kubernetes',emoji:'☸️',cards:[
{q:'Что такое Kubernetes и зачем нужен?',a:'Платформа оркестрации контейнеров: управляет запуском, масштабированием, обновлениями, сетью и хранилищем.'},
{q:'Что такое Pod?',a:'Минимальная единица развёртывания. Содержит один или несколько контейнеров, делящих сеть и тома.'},
{q:'Что такое Deployment?',a:'Объект, описывающий желаемое состояние Pod\'ов. Kubernetes создаёт/удаляет Pod\'ы для поддержания нужного числа реплик. Поддерживает rollout/rollback.'},
{q:'Чем отличается Deployment от StatefulSet?',a:'Deployment — для stateless, Pod\'ы идентичны.\nStatefulSet — для stateful (БД, кэш): сохраняет идентичность Pod\'а (имя, volume), ordered update.'},
{q:'Что такое ReplicaSet?',a:'Объект, следящий за количеством Pod\'ов. Deployment использует ReplicaSet «под капотом».'},
{q:'Что такое ConfigMap и Secret?',a:'ConfigMap — конфигурационные данные (не секретные).\nSecret — чувствительные данные (пароли, токены, base64).'},
{q:'Что такое Service и какие типы бывают?',a:'Абстракция доступа к Pod\'ам.\nClusterIP — внутри кластера.\nNodePort — через порт ноды.\nLoadBalancer — облачный LB.\nExternalName — CNAME для внешнего сервиса.'},
{q:'Что такое Ingress?',a:'Управляет внешним HTTP/HTTPS трафиком, host/path routing, TLS termination. Направляет трафик на Service.'},
{q:'Для чего kubectl port-forward?',a:'Пробрасывает порт пода на локальную машину для тестирования без внешнего Service/LoadBalancer.'},
{q:'Что такое Namespace?',a:'Виртуальное пространство имён для изоляции ресурсов (dev, staging, prod). Позволяет ограничивать доступ и ресурсы.'},
{q:'Что такое DaemonSet?',a:'Гарантирует, что каждая нода запускает копию Pod. Используется для логирования, мониторинга, сетевых агентов.'},
{q:'Что такое Helm?',a:'Менеджер пакетов для Kubernetes. Деплой через charts, управление версиями и зависимостями.'},
{q:'Что такое api-server в кубере?',a:'Главный компонент control plane: обрабатывает REST-запросы kubectl, сохраняет состояние в etcd, все запросы проходят через него.'},
{q:'Что хранится в etcd?',a:'Состояние кластера: Pods, Deployments, ConfigMaps, Secrets, Services, метаданные.'},
{q:'Зачем нужны labels и selectors?',a:'Labels — ключ-значение для идентификации объектов.\nSelectors — фильтруют объекты по labels.'},
{q:'Что такое CronJob?',a:'Запуск Pod по расписанию (как cron). Для тестов, бэкапов, генерации отчётов.'},
{q:'Что такое LivenessProbe и ReadinessProbe?',a:'LivenessProbe — «живой ли контейнер», перезапускает при падении.\nReadinessProbe — готов ли Pod принимать трафик, если нет — исключается из Service endpoints.'},
{q:'Как дебажить Pod, который падает?',a:'kubectl describe pod <pod>\nkubectl logs <pod>\nkubectl exec -it <pod> -- bash\nПроверить readiness/liveness, env, volumeMounts, сеть.'},
{q:'Для чего kubectl apply?',a:'Создаёт или обновляет ресурс, приводя состояние к описанному в YAML.'},
{q:'Что такое kubelet?',a:'Агент на worker-ноде: следит за Pod\'ами, запускает контейнеры через runtime, отчитывается api-server.'},
{q:'Отличие create от apply?',a:'create — создаёт ресурс с нуля (ошибка, если уже существует).\napply — создаёт или обновляет существующий ресурс.'},
{q:'Что такое master node и worker node?',a:'Master Node: kube-apiserver, etcd, scheduler, controller.\nWorker Node: kubelet, kube-proxy, Container Runtime.'},
{q:'Как посмотреть все поды в кластере?',a:'kubectl get pods'},
{q:'Как посмотреть поды в конкретном namespace?',a:'kubectl get pods -n <namespace>'},
{q:'Как посмотреть описание пода?',a:'kubectl describe pod <pod-name> -n <namespace>'},
{q:'Как посмотреть логи пода?',a:'kubectl logs <pod-name> -n <namespace>'},
{q:'Как зайти внутрь контейнера пода?',a:'kubectl exec -it <pod-name> -- bash'},
{q:'Как применить манифест?',a:'kubectl apply -f <file.yaml>'},
{q:'Как масштабировать deployment?',a:'kubectl scale deployment <name> --replicas=5 -n <namespace>'},
{q:'Как посмотреть все ресурсы в namespace?',a:'kubectl get all -n <namespace>'},
{q:'Как посмотреть события в кластере?',a:'kubectl get events -A --sort-by=.metadata.creationTimestamp'},
]},
{id:'git',name:'Git',emoji:'🌿',cards:[
{q:'Что такое commit? Что хранит Git?',a:'Снимок состояния проекта. Хранит: хеш, ссылку на tree-объект, ссылки на родителей, автора, дату, сообщение.'},
{q:'Разница между git pull и git fetch?',a:'git fetch — скачать изменения, не применять.\ngit pull = git fetch + git merge.'},
{q:'Разница между git merge и git rebase?',a:'merge — создаёт merge-коммит, история ветвистая, безопасен.\nrebase — переписывает историю, делает её линейной, перемещает коммиты поверх другой ветки.'},
{q:'Когда нельзя использовать rebase?',a:'Если ветка уже в общем репозитории и по ней работают другие люди — риск потери коммитов.'},
{q:'Что такое fast-forward merge?',a:'Когда в ветке нет новых коммитов — Git просто перемещает указатель, без merge-коммита.'},
{q:'Что такое HEAD в Git?',a:'Ссылка на текущий коммит или ветку, на которую он указывает.'},
{q:'Что такое reflog?',a:'Хранит все перемещения HEAD, даже после reset --hard. Используется для восстановления потерянных коммитов.'},
{q:'Что такое git gc?',a:'Garbage collector. Удаляет старые reflog записи, дубли слоёв, оптимизирует хранилище.'},
{q:'Как восстановить удалённый коммит (reset --hard)?',a:'git reflog\ngit checkout <hash>\ngit branch restore/<name>'},
{q:'Когда использовать reset, а когда revert?',a:'reset — изменяет историю, только локально.\nrevert — создаёт обратный коммит, безопасно, на общих ветках.'},
{q:'Разница между reset --soft, --mixed, --hard?',a:'--soft — двигает только HEAD.\n--mixed — сбрасывает staging.\n--hard — сбрасывает staging + изменения в файлах (файлы исчезнут).'},
{q:'Что делать, если нужно отменить merge-commit?',a:'git revert -m 1 <merge_commit_hash>'},
{q:'Что такое cherry-pick?',a:'Переносит конкретный коммит из одной ветки в другую. Опасность: новый хеш, расходящаяся история, конфликты.'},
{q:'Как происходит merge-conflict?',a:'Одни и те же строки изменены в разных ветках — Git не может выбрать правильную версию.'},
{q:'Как решить merge-conflict?',a:'Открыть файл с маркерами, выбрать/объединить нужную версию, сделать git add, затем git commit.'},
{q:'Как отменить rebase?',a:'git rebase --abort\nили git reflog + git reset --hard <hash>'},
{q:'Зачем git remote prune?',a:'Удаляет старые ссылки на удалённые ветки: git remote prune origin'},
{q:'Что делает git push --force?',a:'Переписывает историю в удалённой ветке. Опасно: можно потерять чужие коммиты, сломать CI.'},
{q:'Как работают git hooks?',a:'Скрипты на события (pre-commit, pre-push, post-merge). В CI: линтеры, форматтеры, запрет секретов, тесты до пуша.'},
{q:'Как найти коммит, который сломал сборку?',a:'git bisect:\ngit bisect start\ngit bisect good <hash>\ngit bisect bad <hash>\nБинарный поиск по коммитам.'},
{q:'Как работает .gitignore?',a:'Определяет файлы, которые Git не отслеживает. Предотвращает добавление лишних файлов в репозиторий.'},
{q:'Где хранить секретные данные?',a:'Vault, Secret Manager, .env (в репо нельзя!). Никогда не в git-истории.'},
{q:'Как посмотреть состояние репозитория?',a:'git status'},
{q:'Как посмотреть историю коммитов?',a:'git log'},
{q:'Как спрятать текущие изменения?',a:'git stash — чтобы переключиться без коммита или убрать грязное состояние.'},
{q:'Как посмотреть различия между версиями?',a:'git diff'},
]},

]},
{id:'pytest',name:'pytest',emoji:'🧪',cards:[
{q:'Что такое pytest?',a:'Фреймворк для автоматизации тестирования на Python: минималистичный синтаксис, гибкие фикстуры, плагинная архитектура, интеграция с CI/CD, мощная параметризация.'},
{q:'Какие scope фикстур знаете?',a:'function — на каждый тест (default).\nclass — на класс тестов.\nmodule — на файл.\nsession — на всю сессию.'},
{q:'Как работает autouse-фикстура?',a:'autouse=True — фикстура вызывается автоматически для всех тестов в своём scope без явного указания.'},
{q:'Что такое yield в фикстуре?',a:'Разделяет setup (до yield) и teardown (после yield). Teardown выполняется даже если тест упал.'},
{q:'Что такое factory-фикстуры?',a:'Фикстура возвращает функцию, позволяя генерировать данные/объекты динамически внутри теста.'},
{q:'Как сделать параметризацию тестов?',a:'@pytest.mark.parametrize("x,y", [(1,2), (3,4)])\nЗапускает тест для каждого набора параметров.'},
{q:'Как мокировать внешние сервисы в pytest?',a:'pytest-mock:\nmocker.patch("module.Class.method", return_value={...})\nmocker.patch.object(instance, "attr", new="value")\nmocker.spy(module, "func")'},
{q:'Как ускорить тесты в pytest?',a:'pytest-xdist (параллельный запуск), session scope фикстуры, мокирование данных, кэширование, разделение по типам.'},
{q:'Что такое xfail и skip?',a:'skip — пропускает тест: @pytest.mark.skip(reason="...")\nxfail — ожидаемо падающий: @pytest.mark.xfail(reason="...")\nНе ломает CI, фиксирует дефект.'},
{q:'Как использовать маркеры?',a:'Прописать в pytest.ini:\n[pytest]\nmarkers = smoke\nregression\nИспользовать: @pytest.mark.smoke\nЗапуск: pytest -m "smoke and not regression"'},
{q:'Как проверять исключения в pytest?',a:'with pytest.raises(ValueError):\n    func()\n\nС проверкой текста:\nwith pytest.raises(ValueError, match="invalid"):\n    func()'},
{q:'Как запустить отдельный тест или группу?',a:'pytest tests/test_login.py::test_valid_login\npytest -m smoke\npytest -k "login"'},
{q:'Что такое conftest.py?',a:'Файл с глобальными фикстурами, хуками и настройками. Pytest автоматически подхватывает его по дереву каталогов.'},
{q:'Что такое pytest-hooks?',a:'pytest_runtest_setup — перед тестом.\npytest_sessionstart — старт сессии.\npytest_sessionfinish — завершение.\npytest_configure — настройка.\nДля кастомных репортов, логирования, авто-retry.'},
{q:'Что такое pytest.ini?',a:'Глобальные настройки:\n[pytest]\nmarkers = smoke, regression\naddopts = -q -ra\ntestpaths = tests\nlog_cli = True'},
{q:'Как минимизировать flaky-тесты?',a:'Стабильные wait, retry, мокирование нестабильных сервисов, изоляция и очистка данных, явные ожидания вместо sleep.'},
]},
{id:'playwright',name:'Playwright',emoji:'🎭',cards:[
{q:'Что такое Playwright и чем отличается от Selenium?',a:'Фреймворк для UI-тестов. Управляет браузером напрямую, без WebDriver.\nПлюсы: встроенный auto-waiting, нативная работа с iframe/shadow DOM, изолированные контексты, network mocking, меньше flaky.'},
{q:'Архитектура Playwright: Browser → Context → Page',a:'Browser — процесс браузера.\nContext — чистая сессия (как инкогнито), свои cookies/localStorage.\nPage — вкладка.\nПозволяет параллельные тесты без конфликтов.'},
{q:'Для чего нужен BrowserContext?',a:'Чистая изолированная сессия: свои cookies, localStorage, заголовки, стейт авторизации. Предотвращает утечки между тестами, позволяет параллельность.'},
{q:'Типы селекторов в Playwright',a:'get_by_... — рекомендуемый, семантический.\nCSS — стабильные.\nXPath — в редких случаях, хрупкие.'},
{q:'Что такое auto-waiting?',a:'Playwright сам ждёт: пока элемент появится, будет видим, готов к клику, закончит анимацию. Каждая команда имеет встроенный retry.'},
{q:'Чем отличается expect от wait_for..?',a:'expect() — assertions + авто-ретрай, проверяет состояние.\nwait_for_...() — низкоуровневые ожидания готовности.'},
{q:'Почему нельзя time.sleep? Что вместо?',a:'time.sleep() вызывает flaky-тесты и блокировки.\nВместо: expect(locator).to_be_visible(), page.wait_for_load_state(), locator.wait_for(), page.wait_for_event()'},
{q:'Как вынести авторизацию в фикстуру?',a:'Логин через API → сохранить storageState.\nВ фикстуре: browser.new_context(storage_state="state.json")'},
{q:'Как замокать API в Playwright?',a:'page.route("**/api/user", lambda route: route.fulfill(\n  status=200,\n  body=json.dumps({"name": "Test"})\n))'},
{q:'Как замедлить ответ от сервера?',a:'page.route("**/api/order", lambda route: route.fulfill(\n  status=200, body="{}", delay=2000\n))'},
{q:'Как скачать файл через Playwright?',a:'with page.expect_download() as d:\n    page.click("button#export")\npath = d.value.path()'},
{q:'Как работать с iframe?',a:'frame = page.frame(name="iframe-name")\nframe.locator("button").click()'},
{q:'Как запустить тесты headless/headful?',a:'Headless — для CI (быстрее).\nHeadful — для дебага.\n--headless=false'},
{q:'Как делать локаторы устойчивыми?',a:'Использовать get_by_... (семантические), избегать XPath и динамических селекторов.'},
{q:'Плюсы и минусы Playwright',a:'Плюсы: быстрый, стабильный, мощный API, network mocking, изоляция контекстов, видео/трассировки.\nМинусы: много обновлений, сложнее на Windows, ресурсоёмкий.'},
{q:'Как Playwright взаимодействует с DOM?',a:'Через Locator — ленивый объект, переискивает элемент, ждёт появления/рендера/стабильности. На низком уровне — DevTools Protocol.'},

{id:'patterns',name:'Паттерны',emoji:'🏗️',cards:[
{q:'Page Object — суть и зачем?',a:'Вынос логики взаимодействия с UI-элементами в отдельные классы страницы. Каждая страница инкапсулирует локаторы и действия.\n\nЗачем:\n— Тесты становятся чистыми\n— Уменьшается дублирование (локаторы переиспользуемы)\n— При изменениях меняется только Page-класс, не сами тесты'},
{q:'Step Object — суть и зачем?',a:'Вынос логических шагов теста в отдельные классы или методы. Описывает ЧТО делает пользователь, а не КАК это реализовано.\n\nЗачем:\n— Удобен для отчётов Allure\n— Повышает читаемость тестов\n— Шаги можно переиспользовать в разных тестах'},
{q:'Factory (Фабрика) — суть и зачем?',a:'Централизованное создание объектов с нужными параметрами.\n\nЗачем:\n— Упрощает создание тестовых данных\n— Делает тесты независимыми\n— Можно параметризировать для разных сценариев'},
{q:'Singleton — суть и зачем?',a:'Гарантирует, что класс имеет только один экземпляр во всём приложении. В тестах используется для глобального конфига, логгера, соединения с БД.\n\nЗачем:\n— Один объект конфигурации на всё приложение\n— Данные загружаются один раз'},
{q:'Strategy — суть и зачем?',a:'Позволяет подменять алгоритмы поведения во время выполнения. В автотестах: разные способы валидации, авторизации, оплаты.\n\nЗачем:\n— Гибко меняем алгоритм без изменения теста\n— Тест параметризируется типом стратегии'},
{q:'Adapter — суть и зачем?',a:'Оборачивает объект с одним интерфейсом и переводит его в другой формат. Позволяет использовать объекты с несовместимыми интерфейсами вместе.\n\nЗачем:\n— Не менять логику теста при смене источника данных\n— Унифицировать данные из UI и API для сравнения'},
{q:'Decorator (паттерн) — суть и зачем?',a:'Дополняет функциональность без изменения логики исходного кода. В тестах: логирование, тайминг, Allure-обёртки.\n\nЗачем:\n— Не переписывать изначальный код\n— Изящно добавить новую функциональность'},
{q:'Чем отличается Page Object от Step Object?',a:'Page Object — инкапсулирует локаторы и действия с UI-элементами конкретной страницы. Отвечает на вопрос КАК взаимодействовать.\n\nStep Object — инкапсулирует бизнес-шаги пользователя. Отвечает на вопрос ЧТО делает пользователь.\n\nStep Object использует Page Object внутри себя.'},
{q:'Когда использовать Factory вместо прямого создания объектов?',a:'Когда:\n— Нужно создавать много однотипных объектов с разными параметрами\n— Логика создания сложная и должна быть централизована\n— Хочешь скрыть детали создания от потребителя\n— Нужна параметризация тестовых данных (faker + factory)'},
{q:'Когда применяется паттерн Adapter в автотестах?',a:'Когда нужно сравнить данные из разных источников с разными форматами:\n— UI отдаёт "$123.45" / "26 Oct 2025"\n— API отдаёт 12345 (центы) / "2025-10-26T15:30:00Z"\n\nАдаптер приводит оба к единому формату для assert-а.'},
{q:'Паттерн Strategy vs простой if/else — в чём разница?',a:'if/else:\n— Логика разрастается в одном месте\n— Сложно расширять\n— Нарушает Open/Closed принцип\n\nStrategy:\n— Каждый алгоритм в своём классе\n— Легко добавить новую стратегию без изменения существующего кода\n— Тест не знает деталей реализации'},
]},
];

// ================= STORAGE =================
function lsGet(key, def){ try{ return JSON.parse(localStorage.getItem(key)) ?? def; }catch(e){ return def; } }
function lsSet(key, val){ localStorage.setItem(key, JSON.stringify(val)); }

let customCards = lsGet('custom_cards', []);
function saveCustom(){ lsSet('custom_cards', customCards); }

// ================= THEME =================
const savedTheme = localStorage.getItem('app_theme') || '';
if(savedTheme) document.body.dataset.theme = savedTheme;
const themeBtn = document.getElementById('themeBtn');
const themePop = document.getElementById('themePop');
themeBtn.onclick = (e)=>{ e.stopPropagation(); themePop.classList.toggle('open'); };
document.addEventListener('click', ()=> themePop.classList.remove('open'));
document.querySelectorAll('.theme-opt').forEach(b=>{
  b.onclick = ()=>{
    const t = b.dataset.theme;
    if(t) document.body.dataset.theme = t; else delete document.body.dataset.theme;
    localStorage.setItem('app_theme', t);
    themePop.classList.remove('open');
  };
});

// ================= STREAK =================
function todayStr(){ const d = new Date(); return d.getFullYear()+'-'+String(d.getMonth()+1).padStart(2,'0')+'-'+String(d.getDate()).padStart(2,'0'); }
function yesterdayStr(){ const d = new Date(); d.setDate(d.getDate()-1); return d.getFullYear()+'-'+String(d.getMonth()+1).padStart(2,'0')+'-'+String(d.getDate()).padStart(2,'0'); }
function getStreak(){
  const s = lsGet('streak', {last:null, count:0});
  if(s.last === todayStr() || s.last === yesterdayStr()) return s.count;
  return 0; // серия сгорела
}
function bumpStreak(){
  const s = lsGet('streak', {last:null, count:0});
  const today = todayStr();
  if(s.last === today) return s.count; // уже засчитано сегодня
  const newCount = (s.last === yesterdayStr()) ? s.count + 1 : 1;
  lsSet('streak', {last: today, count: newCount});
  return newCount;
}
function plural(n, forms){ // forms: ['день','дня','дней']
  const m10 = n%10, m100 = n%100;
  if(m10===1 && m100!==11) return forms[0];
  if(m10>=2 && m10<=4 && (m100<10||m100>=20)) return forms[1];
  return forms[2];
}
function renderStreak(){
  const n = getStreak();
  document.getElementById('streakCount').textContent = n;
  document.getElementById('streakWord').textContent = plural(n, ['день','дня','дней']);
  document.getElementById('streakFire').classList.toggle('streak-dead', n===0);
}

// ================= CARDS =================
function allCards(){
  const arr = [];
  SECTIONS.forEach(sec => {
    sec.cards.forEach((c,i) => arr.push({...c, sectionId:sec.id, sectionName:sec.name, isCustom:false, uid:`${sec.id}_${i}`}));
  });
  customCards.forEach((c,i) => arr.push({...c, sectionId:c.sectionId||'custom', sectionName:c.sectionName||'Мои карточки', isCustom:true, uid:`custom_${i}`}));
  return arr;
}

function showScreen(id){
  document.querySelectorAll('.screen').forEach(s=>s.classList.remove('active'));
  document.getElementById(id).classList.add('active');
  window.scrollTo(0,0);
  document.getElementById('addBtn').style.display = (id==='base') ? 'block' : 'none';
}
document.getElementById('goBase').onclick = ()=>{ showScreen('base'); renderBase(); };
document.getElementById('goTrain').onclick = ()=> showScreen('trainer');
document.querySelectorAll('[data-back]').forEach(b=> b.onclick = ()=>{ showScreen('home'); renderStreak(); });

// home stats
function renderHomeStats(){
  const total = allCards().length;
  document.getElementById('baseStats').textContent = `${total} ${plural(total,['вопрос','вопроса','вопросов'])} · ${SECTIONS.length} тем`;
}

// ================= БАЗА ВОПРОСОВ =================
let currentFilter = 'all';
let searchQ = '';

function esc(s){ return s.replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;').replace(/"/g,'&quot;'); }

function renderFilters(){
  const f = document.getElementById('filters');
  const hasCustom = customCards.some(c=>!c.sectionId || c.sectionId==='custom');
  const items = [
    {id:'all', label:'Все'},
    ...SECTIONS.map(s=>({id:s.id, label:`${s.emoji} ${s.name}`})),
    ...(hasCustom ? [{id:'custom', label:'✨ Мои карточки'}] : [])
  ];
  f.innerHTML = items.map(i=>`<button class="chip${currentFilter===i.id?' active':''}" data-f="${i.id}">${i.label}</button>`).join('');
  f.querySelectorAll('.chip').forEach(c=> c.onclick = ()=>{ currentFilter = c.dataset.f; renderBase(); });
}

function renderCards(cards, container){
  container.innerHTML = cards.map((c,i)=>`
    <div class="card" data-i="${i}">
      ${c.isCustom ? `<button class="del-btn" data-uid="${c.uid}">✕</button>` : ''}
      <div class="card-inner">
        <div class="card-face card-front">
          <div class="card-label">Вопрос${c.isCustom?' · своя':''}</div>
          <div class="card-q">${esc(c.q)}</div>
        </div>
        <div class="card-face card-back">
          <div class="card-label">Ответ</div>
          <div class="card-a">${esc(c.a)}</div>
        </div>
      </div>
    </div>`).join('');
  container.querySelectorAll('.card').forEach(el=>{
    el.onclick = (e)=>{ if(e.target.classList.contains('del-btn')) return; el.classList.toggle('flipped'); };
  });
  container.querySelectorAll('.del-btn').forEach(b=>{
    b.onclick = ()=>{
      const idx = parseInt(b.dataset.uid.replace('custom_',''));
      if(confirm('Удалить эту карточку?')){ customCards.splice(idx,1); saveCustom(); renderBase(); renderHomeStats(); }
    };
  });
}

function renderBase(){
  renderFilters();
  const main = document.getElementById('main');
  const q = searchQ.toLowerCase();
  let cards = allCards();
  if(currentFilter!=='all') cards = cards.filter(c=>c.sectionId===currentFilter);
  if(q) cards = cards.filter(c=> c.q.toLowerCase().includes(q) || c.a.toLowerCase().includes(q));

  if(currentFilter==='all' && !q){
    const hasCustom = cards.some(c=>c.sectionId==='custom');
    main.innerHTML = SECTIONS.map(s=>`
      <div class="sec-title">${s.emoji} ${s.name} <span class="cnt">${cards.filter(c=>c.sectionId===s.id).length}</span></div>
      <div class="grid" id="grid_${s.id}"></div>`).join('') +
      (hasCustom ? `<div class="sec-title">✨ Мои карточки <span class="cnt">${cards.filter(c=>c.sectionId==='custom').length}</span></div><div class="grid" id="grid_custom"></div>` : '');
    SECTIONS.forEach(s=> renderCards(cards.filter(c=>c.sectionId===s.id), document.getElementById('grid_'+s.id)));
    if(hasCustom) renderCards(cards.filter(c=>c.sectionId==='custom'), document.getElementById('grid_custom'));
  } else {
    main.innerHTML = `<div class="sec-title">Найдено <span class="cnt">${cards.length}</span></div><div class="grid" id="maingrid"></div>`;
    renderCards(cards, document.getElementById('maingrid'));
  }
}

document.getElementById('search').oninput = (e)=>{ searchQ = e.target.value.trim(); renderBase(); };

// ---- add card modal ----
const modalOv = document.getElementById('modalOv');
const mTopic = document.getElementById('mTopic');
mTopic.innerHTML = `<option value="custom">✨ Мои карточки</option>` +
  SECTIONS.map(s=>`<option value="${s.id}">${s.emoji} ${s.name}</option>`).join('');
document.getElementById('addBtn').onclick = ()=>{ modalOv.classList.add('open'); document.getElementById('mQ').focus(); };
document.getElementById('mCancel').onclick = ()=> modalOv.classList.remove('open');
modalOv.onclick = (e)=>{ if(e.target===modalOv) modalOv.classList.remove('open'); };
document.getElementById('mSave').onclick = ()=>{
  const q = document.getElementById('mQ').value.trim();
  const a = document.getElementById('mA').value.trim();
  if(!q || !a){ alert('Заполни и вопрос, и ответ.'); return; }
  const sid = mTopic.value;
  const sec = SECTIONS.find(s=>s.id===sid);
  customCards.push({q, a, sectionId:sid, sectionName: sec ? sec.name : 'Мои карточки'});
  saveCustom();
  document.getElementById('mQ').value=''; document.getElementById('mA').value='';
  modalOv.classList.remove('open');
  renderBase(); renderHomeStats();
};

// ================= ТРЕНИРОВКА =================
let tQueue = [], tTotal = 0, tRepeats = 0, tFlipped = false, tAnimating = false, tCount = 10;

function shuffle(arr){
  const a = [...arr];
  for(let i=a.length-1;i>0;i--){ const j = Math.floor(Math.random()*(i+1)); [a[i],a[j]]=[a[j],a[i]]; }
  return a;
}

document.querySelectorAll('#trainer .menu-btn').forEach(b=>{
  b.onclick = ()=>{ tCount = parseInt(b.dataset.count); startTraining(); };
});

function startTraining(){
  tQueue = shuffle(allCards()).slice(0, tCount);
  tTotal = tQueue.length;
  tRepeats = 0; tFlipped = false;
  document.getElementById('tfinish').classList.remove('visible');
  document.getElementById('tcard').style.display = 'flex';
  document.querySelector('.t-hints').style.display = 'flex';
  document.querySelector('.t-actions').style.display = 'flex';
  document.querySelector('.t-top').style.visibility = 'visible';
  document.getElementById('tov').classList.add('open');
  showTCard();
}

function showTCard(){
  if(!tQueue.length){ showTFinish(); return; }
  tFlipped = false; tAnimating = false;
  const c = tQueue[0];
  const card = document.getElementById('tcard');
  card.style.transition = 'none'; card.style.transform = ''; card.style.opacity = '1';
  document.getElementById('ttopic').textContent = c.sectionName || 'Мои карточки';
  document.getElementById('tq').textContent = c.q;
  document.getElementById('tatext').textContent = c.a;
  document.getElementById('tans').classList.remove('visible');
  document.getElementById('thint').style.display = 'block';
  document.getElementById('tind-l').style.opacity = '0';
  document.getElementById('tind-r').style.opacity = '0';
  document.getElementById('tno').disabled = true;
  document.getElementById('tyes').disabled = true;
  updateTProgress();
}

function flipTCard(){
  if(tFlipped || tAnimating) return;
  tFlipped = true;
  document.getElementById('tans').classList.add('visible');
  document.getElementById('thint').style.display = 'none';
  document.getElementById('tno').disabled = false;
  document.getElementById('tyes').disabled = false;
}

function updateTProgress(){
  const done = tTotal - tQueue.length;
  const pct = tTotal ? Math.round(done/tTotal*100) : 0;
  document.getElementById('tpf').style.width = pct+'%';
  document.getElementById('tcnt').textContent = `${done} / ${tTotal}`;
}

function swipeCard(direction){
  // 'left' = повторить в конце, 'right' = дальше без повторения
  if(tAnimating) return;
  if(!tFlipped){ flipTCard(); return; }
  tAnimating = true;
  const card = document.getElementById('tcard');
  const dx = direction === 'right' ? 500 : -500;
  card.style.transition = 'transform .35s ease, opacity .35s';
  card.style.transform = `translateX(${dx}px) rotate(${direction==='right'?15:-15}deg)`;
  card.style.opacity = '0';

  const cur = tQueue[0];
  if(direction === 'left'){ tRepeats++; tTotal++; tQueue.push(cur); }
  tQueue.shift();

  setTimeout(showTCard, 380);
}

function showTFinish(){
  document.getElementById('tcard').style.display = 'none';
  document.querySelector('.t-hints').style.display = 'none';
  document.querySelector('.t-actions').style.display = 'none';
  document.querySelector('.t-top').style.visibility = 'hidden';
  const streak = bumpStreak();
  document.getElementById('tfinmsg').textContent = `Пройдено карточек: ${tTotal} · повторений: ${tRepeats}`;
  document.getElementById('tfinstreak').innerHTML = `🔥 Серия: <b>${streak}</b> ${plural(streak,['день','дня','дней'])} подряд`;
  document.getElementById('tfinish').classList.add('visible');
}

function closeTraining(){
  document.getElementById('tov').classList.remove('open');
  renderStreak();
}
document.getElementById('tclose').onclick = closeTraining;
document.getElementById('tfinclose').onclick = closeTraining;
document.getElementById('tfinrepeat').onclick = startTraining;
document.getElementById('tno').onclick = ()=>{ if(tFlipped) swipeCard('left'); };
document.getElementById('tyes').onclick = ()=>{ if(tFlipped) swipeCard('right'); };

// ---- swipe (touch + mouse) ----
(function(){
  const card = document.getElementById('tcard');
  let startX = 0, startY = 0, dx = 0, dragging = false, moved = false, isVertical = false;
  const THRESHOLD = 90;

  function onStart(x, y){
    if(tAnimating) return;
    dragging = true; moved = false; isVertical = false;
    startX = x; startY = y; dx = 0;
    card.style.transition = 'none';
  }
  function onMove(x, y){
    if(!dragging || tAnimating) return;
    const dy = y - startY;
    dx = x - startX;
    if(!moved && Math.abs(dy) > Math.abs(dx) && Math.abs(dy) > 12){ isVertical = true; }
    if(isVertical) return;
    if(Math.abs(dx) > 6) moved = true;
    if(!tFlipped) return; // до переворота свайп не работает
    card.style.transform = `translateX(${dx}px) rotate(${dx/28}deg)`;
    document.getElementById('tind-l').style.opacity = dx < -35 ? Math.min(1, -dx/120) : 0;
    document.getElementById('tind-r').style.opacity = dx > 35 ? Math.min(1, dx/120) : 0;
  }
  function onEnd(){
    if(!dragging) return;
    dragging = false;
    if(isVertical) return;
    if(!moved){ // это был тап/клик
      if(!tFlipped) flipTCard(); else flipBack();
      return;
    }
    if(!tFlipped) return;
    if(dx <= -THRESHOLD){ swipeCard('left'); }
    else if(dx >= THRESHOLD){ swipeCard('right'); }
    else {
      card.style.transition = 'transform .25s';
      card.style.transform = '';
      document.getElementById('tind-l').style.opacity = '0';
      document.getElementById('tind-r').style.opacity = '0';
    }
  }
  function flipBack(){ /* повторный тап скрывает/показывает ответ */
    const ans = document.getElementById('tans');
    ans.classList.toggle('visible');
  }

  card.addEventListener('touchstart', e=> onStart(e.touches[0].clientX, e.touches[0].clientY), {passive:true});
  card.addEventListener('touchmove', e=> onMove(e.touches[0].clientX, e.touches[0].clientY), {passive:true});
  card.addEventListener('touchend', onEnd);
  card.addEventListener('mousedown', e=>{ e.preventDefault(); onStart(e.clientX, e.clientY); });
  window.addEventListener('mousemove', e=> onMove(e.clientX, e.clientY));
  window.addEventListener('mouseup', onEnd);
})();

// keyboard
document.addEventListener('keydown', e=>{
  if(!document.getElementById('tov').classList.contains('open')) return;
  if(e.key===' '||e.key==='Enter'){ e.preventDefault(); flipTCard(); }
  else if(e.key==='ArrowLeft'){ if(tFlipped) swipeCard('left'); }
  else if(e.key==='ArrowRight'){ if(tFlipped) swipeCard('right'); }
  else if(e.key==='Escape'){ closeTraining(); }
});

// ================= INIT =================
renderStreak();
renderHomeStats();
showScreen('home');
</script>
